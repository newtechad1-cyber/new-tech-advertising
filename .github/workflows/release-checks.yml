name: NTA release checks
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nta-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: IndexNow offline regression tests
        run: node --test tests/indexnow.test.mjs
      - name: Release-check regression tests
        run: node --test tests/release-checks.test.mjs
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Candidate code checks (no network)
        run: |
          sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups \
            env -i PATH="$PATH" HOME="$HOME" CI=true npm run check:ci
      # F3 is a separate backlog: retain the pre-106 suite, not a false all-tests claim.
      # No deployment or publication of this candidate-only artifact occurs here.

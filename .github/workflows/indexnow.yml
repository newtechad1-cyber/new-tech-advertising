name: Notify IndexNow

# Manual post-publication notification only. A GitHub merge is not Base44 Publish.
# Rick starts this workflow after the live site is verified.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    # A manual run on a review branch must not notify search engines.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: IndexNow offline regression tests
        run: node --test tests/indexnow.test.mjs
      - name: Submit public sitemap URLs to IndexNow
        run: node scripts/submit-indexnow.mjs --all --submit

name: Notify IndexNow

on:
  push:
    branches:
      - main
    paths:
      - "public/sitemap.xml"
      - "public/ai-sitemap.json"
      - "public/robots.txt"
      - "public/*.txt"
      - "index.html"
      - "src/**"
      - "scripts/generate-seo-pages.mjs"
      - "scripts/submit-indexnow.mjs"
      - "tests/indexnow.test.mjs"
      - "base44/functions/listPages/entry.ts"
      - ".github/workflows/indexnow.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    # A manual run on a review branch must not notify search engines.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: IndexNow offline regression tests
        run: node --test tests/indexnow.test.mjs
      - name: Submit public sitemap URLs to IndexNow
        run: node scripts/submit-indexnow.mjs --all --submit

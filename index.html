  <body>
    <div id="nta-public-startup-cover" aria-hidden="true"></div>
    <div id="root"></div>
    <script>
      (function () {
        function dismissStartupCover() {
          var cover = document.getElementById('nta-public-startup-cover');
          if (!cover) return;
          cover.classList.add('nta-public-startup-cover--done');
          window.setTimeout(function () { cover.remove(); }, 160);
        }
        window.addEventListener('DOMContentLoaded', function () {
          window.requestAnimationFrame(function () {
            window.requestAnimationFrame(dismissStartupCover);
          });
        }, { once: true });
        // A hard timeout makes the startup surface self-removing even if a
        // browser extension interrupts the normal startup sequence.
        window.setTimeout(dismissStartupCover, 3000);
      }());
    </script>
